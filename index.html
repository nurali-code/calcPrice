<body>
    <h2>Калькулятор: Обратные 20%</h2>
    <label for="finalValue">Введите итоговое значение (после вычета 20%):</label>
    <input type="number" id="finalValue" placeholder="Например, 3200">
    <button onclick="calculateOriginal()">Рассчитать</button>
    <p id="result"></p>

    <script>
        async function calculateFromClipboard() {
            const resultEl = document.getElementById("result");

            try {
                const rawText = await navigator.clipboard.readText();

                // Удаление всего кроме цифр, точки и запятой
                let cleaned = rawText.replace(/[^\d.,]/g, "");

                // Если есть и запятая, и точка — оставить только одну
                if (cleaned.includes(",") && cleaned.includes(".")) {
                    // Удалим запятую, если точка используется как десятичный разделитель
                    cleaned = cleaned.replace(/,/g, "");
                } else {
                    // Заменим запятую на точку (если есть)
                    cleaned = cleaned.replace(",", ".");
                }

                const value = parseFloat(cleaned);

                if (isNaN(value)) {
                    resultEl.textContent = `Буфер не содержит корректное число:\n"${rawText}"`;
                    return;
                }

                const originalValue = value / 0.8;
                resultEl.innerHTML = `<h1>${originalValue.toFixed(0)}₽</h1>`;
            } catch (err) {
                resultEl.textContent =
                    "Ошибка доступа к буферу обмена. Разрешите доступ или используйте HTTPS.";
            }
        }

        document.body.addEventListener("click", calculateFromClipboard);
    </script>
</body>
